  <div class="container">
    <h2>Fase Autônoma</h2>

      <label>Artefatos (idade média) entregues no museu:</label>

      <label>Artefatos (pré-históricos) entregues no museu:</label>
      <input type="number" min="0">
    </div>

      <button onclick="window.location.href='index.html'">⬅ Voltar</button>
      <button onclick="window.location.href='teleop.html'">Próximo ➜</button>
