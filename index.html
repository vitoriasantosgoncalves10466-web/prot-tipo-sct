<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Início - Sistema Scout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html"  class="active">Início</a>
      <a href="autonomo.html">Autônomo</a>
      <a href="teleop.html">Teleoperado</a>
      <a href="endgame.html">End Game</a>
    </nav>
  </header>

  <div class="container">
    <h2>Informações da Partida</h2>

    <div class="campo">
      <label>Número da partida:</label>
      <input type="number" placeholder="Ex: 12">
    </div>

    <div class="campo">
      <label>Tipo de partida:</label>
      <select>
        <option>Selecione</option>
        <option>Playoff</option>
        <option>Treino</option>
        <option>Qualificatórias</option>
        <option>Semifinais</option>
      </select>
    </div>

    <div class="campo">
      <label>Número da equipe:</label>
      <input type="number" placeholder="Ex: 7567">
    </div>

    <div class="campo">
      <label>Cor da aliança:</label>
      <select>
        <option>Selecione</option>
        <option>Vermelha</option>
        <option>Azul</option>
      </select>
    </div>

    <div class="campo">
      <label>Posição na arena:</label>
      <select>
        <option>1</option>
        <option>2</option>
        <option>3</option>
      </select>
    </div>

    <div class="campo">
      <label>Nome do scout:</label>
      <input type="text" placeholder="Ex: Vitória">
    </div>

    <div class="navegacao">
      <button onclick="window.location.href='autonomo.html'">Próximo ➜</button>
    </div>
  </div>

</body>
</html>
